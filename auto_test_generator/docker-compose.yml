services:
  # The LLM Engine (CPU Optimized)
  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ./ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # The Vector Database
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  # Your RAG Service
  rag-service:
    build: 
      context: ./rag-service
    container_name: rag_api
    ports:
      - "8000:8000"
    volumes:
      - ./rag-service/data:/data
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
      

  # The Workflow Orchestrator
  n8n:
    image: n8nio/n8n
    container_name: n8n
    user: root
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - NODES_EXCLUDE=
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_FILES_ALLOWED_PATH=/root/.n8n-files
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./rag-service/data:/root/.n8n-files